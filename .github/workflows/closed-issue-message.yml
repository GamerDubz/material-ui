name: Add closing message to issue

on:
  issues:
    types:
      - closed

permissions: {}

jobs:
  add-comment:
    name: Add closing message
    if: github.event.issue.state_reason == 'completed'
    uses: mui/mui-public/.github/workflows/issues_add-closing-message.yml@1528dd11a9b88caecbdf6eb74002cbee8b601b3a # master
    permissions:
      contents: read
      issues: write
